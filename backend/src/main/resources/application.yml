spring:
  application:
    name: gida-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gida_dev}
    username: ${DB_USER:gida}
    password: ${DB_PASSWORD:gida}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 120MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

gida:
  moderation:
    auto-approve: ${GIDA_MODERATION_AUTO_APPROVE:false}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: gida
    audience: gida-web
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
