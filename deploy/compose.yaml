name: gida

services:
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: gida
      POSTGRES_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - /srv/gida-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - backend

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/gida
      DB_USER: ${DB_USER:?Set DB_USER in deploy/.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in deploy/.env}
      GIDA_MEDIA_DIR: /app/data/media
    volumes:
      - /srv/gida-data/media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
